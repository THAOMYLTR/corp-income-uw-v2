# =============================================================================
# DOCUMENT MATRIX — CORP INCOME (khách hàng doanh nghiệp, KHDN)
# =============================================================================
#
# SOURCE OF TRUTH for document routing — "BRD_documentmatrix" (27/10/2026).
# Editing this file changes which document is recognised, which folder it
# belongs to and what is extracted from it — no Python change required.
#
# --- Folders (upload boxes) — one per section of the document matrix ---------
#   ho_so_phap_ly            I     Hồ sơ pháp lý
#   ho_so_tai_chinh          II    Hồ sơ tài chính
#   ho_so_vay_von            III   Hồ sơ vay vốn
#   ho_so_tai_san_dam_bao    IV    Hồ sơ TSBĐ
#   ho_so_noi_bo             V     Hồ sơ nội bộ (CIC, blacklist, internal / external data)
#   ho_so_soan_thao_noi_bo   VII   Hồ sơ nội bộ soạn thảo
#   ho_so_khac               VIII  Hồ sơ khác (overlay CIC, báo cáo adhoc, ngoài danh mục)
#
# --- Agents of the document matrix (matrix_agents) ----------------------------
#   CIA Corp Income Agent   LA Legal Assessment     BA Business Activity
#   FS  Financial Statement RA Risk Assessment      CP Credit Proposal
#   CR  Credit Relationship
# This repo runs CIA. A type whose matrix_agents has no CIA (TSBĐ, chứng thư
# định giá) is recognised and listed but never read by CIA. Inside CIA the
# sections of the report follow the other codes:
#   LA → mục 1 Pháp lý · BA → mục 2 Hoạt động KD · FS → mục 3 Tài chính
#   CR/RA → mục 4 Dư nợ tại TCTD, phân nhóm · CP → mục 5 Kết luận nguồn thu
#
# --- Fields of a `type` -------------------------------------------------------
#   id          technical key, never changed (written into logs).
#   code        number on the document matrix (100, 101, 200, 205, 208, 301,
#               302, 400, 401, 701, 706, 708); "" = not numbered in the matrix.
#   matrix_agents  agents of the document matrix that read this type.
#   agents      CORP_INCOME_AGENT: R (required) or O (optional). Must be set
#               exactly when matrix_agents contains CIA (the loader checks).
#   validation  rules of the matrix, shown in the "Hồ sơ" sheet as a checklist.
#   source      customer = KH cung cấp · field = thực địa / RBO
#               external = tra cứu Cổng ĐKDN, thuế, BHXH · internal = TCB systems
#   filename_keywords  scored against the FILENAME only, ×3.
#   keywords    scored against filename (×3) and content; unaccented, lowercase.
#   requirement.cap_moi "Bắt buộc" → the evidence-gap check stops without it.
#   <pass>_extraction: true → that LLM pass runs on documents of this type
#               (each flag = one LLM call per document):
#     legal_basic (mục 1a) · shareholders (1b) · legal_rep (1a/1b) ·
#     liabilities (nợ thuế, BHXH, tranh chấp) · financial (mục 3) ·
#     vat (mục 3, nguyên tắc 2) · cic (mục 4) · plan (mục 5) ·
#     business_model (mục 2: ngành TCB, đối tác đầu vào / đầu ra)

